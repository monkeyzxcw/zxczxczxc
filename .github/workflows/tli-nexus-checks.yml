name: TLI Nexus checks

on:
  push:
    branches:
      - "release/tli-nexus-*"
    paths:
      - "TLI-Nexus-2.0.0/**"
      - ".github/workflows/tli-nexus-checks.yml"
  pull_request:
    branches:
      - "release/tli-nexus-*"
      - main
    paths:
      - "TLI-Nexus-2.0.0/**"
      - ".github/workflows/tli-nexus-checks.yml"

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: TLI-Nexus-2.0.0
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.13.1"
      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Run syntax, tests and release verifier
        run: npm run release:check
